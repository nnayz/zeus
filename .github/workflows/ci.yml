name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  homebrew-cask:
    name: Homebrew cask
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
      - name: Verify monorepo tap layout
        run: |
          test -d Casks
          test ! -L Casks
          test -f Casks/zeus.rb
      - name: Check cask syntax and style
        run: |
          ruby -c Casks/zeus.rb
          brew style Casks/zeus.rb
      - name: Validate cask metadata
        run: |
          casks="$(find Casks -maxdepth 1 -type f -name '*.rb' | sort)"
          test "${casks}" = "Casks/zeus.rb"
          grep -q 'github.com/nnayz/zeus/releases' Casks/zeus.rb
          grep -q 'app "zeus.app"' Casks/zeus.rb

  engine:
    name: Repo guards
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
      - name: Validate shell scripts
        run: bash -n scripts/*.sh zeus/scripts/*.sh
      - name: Verify reviewed regressions stay fixed
        run: zeus/scripts/verify-remote-refactor.sh
      - name: Test release publishing guards
        run: |
          bash zeus/scripts/test-publish-github-release.sh
          bash zeus/scripts/test-publish-homebrew-cask.sh
      - name: Install and audit browser sidecar
        working-directory: sidecar
        run: |
          npm ci
          npm audit --omit=dev

  app:
    name: Rust app (zeus)
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: zeus
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
      # rust-toolchain.toml pins 1.95.0 with clippy + rustfmt.
      - name: Cache cargo registry and target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            zeus/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('zeus/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Remote Holder acceptance and latency gates
        run: scripts/remote-acceptance.sh
      - name: Release build
        run: cargo build --workspace --release

  remote-helper-native:
    name: Remote Helper (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - runner: macos-15
            target: aarch64-apple-darwin
    defaults:
      run:
        working-directory: zeus
    steps:
      - uses: actions/checkout@v7
      - name: Install target
        run: rustup target add "${{ matrix.target }}"
      - name: Install native musl linker
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - name: Build exact release Helper
        env:
          ZEUS_REMOTE_BUILD_ID: ci-${{ matrix.target }}
        run: cargo build --locked --release --package zeus-remote --target "${{ matrix.target }}"
      - name: Execute native probe and verify identity
        env:
          EXPECTED_TARGET: ${{ matrix.target }}
          EXPECTED_BUILD: ci-${{ matrix.target }}
        run: |
          helper="target/${EXPECTED_TARGET}/release/zeus-remote"
          test -x "${helper}"
          probe="$("${helper}" probe --format=json)"
          jq -e \
            --arg target "${EXPECTED_TARGET}" \
            --arg build "${EXPECTED_BUILD}" \
            '.target == $target and .buildId == $build and .protocol.major == 1 and .supported and .holderAvailable' \
            <<<"${probe}"

  remote-ssh-soak:
    name: Remote OpenSSH detach/reconnect
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: zeus
    steps:
      - uses: actions/checkout@v7
      - name: Start disposable ordinary-user SSH endpoint
        run: |
          sudo apt-get update
          sudo apt-get install --yes openssh-server
          # sshd refuses to start without its privilege separation directory,
          # which the package does not create on a fresh runner image.
          sudo mkdir -p /run/sshd
          # The runner account ships with no password, which leaves it locked
          # ("!" in shadow) and makes sshd reject it before it ever considers
          # the key. Unlock it without setting one; password and
          # keyboard-interactive auth stay disabled below, so keys remain the
          # only way in on this throwaway host.
          sudo usermod -p '*' "${USER}"
          mkdir -p "${HOME}/.ssh" "${RUNNER_TEMP}/sshd"
          chmod 700 "${HOME}/.ssh"
          ssh-keygen -q -t ed25519 -N '' -f "${RUNNER_TEMP}/zeus_$!1i_key"
          cat "${RUNNER_TEMP}/zeus_$!1i_key.pub" >> "${HOME}/.ssh/authorized_keys"
          chmod 600 "${HOME}/.ssh/authorized_keys"
          printf '%s\n' \
            'Host zeus-ci-soak' \
            '  HostName 127.0.0.1' \
            '  Port 2222' \
            "  User ${USER}" \
            "  IdentityFile ${RUNNER_TEMP}/zeus_$!1i_key" \
            '  IdentitiesOnly yes' \
            '  StrictHostKeyChecking accept-new' \
            "  UserKnownHostsFile ${RUNNER_TEMP}/known_hosts" \
            > "${HOME}/.ssh/config"
          chmod 600 "${HOME}/.ssh/config"
          sudo /usr/sbin/sshd -D -e -p 2222 \
            -o PasswordAuthentication=no \
            -o KbdInteractiveAuthentication=no \
            -o UsePAM=no \
            -o AllowUsers="${USER}" \
            -o PidFile="${RUNNER_TEMP}/sshd/sshd.pid" \
            >"${RUNNER_TEMP}/sshd.log" 2>&1 &
          for attempt in $(seq 1 50); do
            if ssh -o BatchMode=yes zeus-ci-soak true; then
              exit 0
            fi
            sleep 0.1
          done
          cat "${RUNNER_TEMP}/sshd.log"
          exit 1
      - name: Run real SSH persistence soak
        env:
          ZEUS_REMOTE_SSH_TARGET: zeus-ci-soak
          ZEUS_REMOTE_SOAK_SECONDS: "5"
        run: scripts/remote-ssh-soak.sh

  bundle:
    name: Package zeus.app (unsigned)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
      - name: Cache cargo registry and target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            zeus/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('zeus/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      # package.sh lipos two slices into a universal binary, so both targets
      # have to be installed — and installed for the toolchain zeus/ pins in
      # rust-toolchain.toml, not the runner default. Adding them from the repo
      # root silently equips the wrong toolchain and the x86_64 pass then fails
      # with "can't find crate for std".
      - name: Install universal targets
        working-directory: zeus
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin aarch64-unknown-linux-musl x86_64-unknown-linux-musl
      - name: Install Rust packaging tools
        run: |
          brew install zig
          cargo install cargo-packager --locked
          cargo install cargo-zigbuild --locked
      - name: Package
        env:
          ZEUS_DIST_DIR: ${{ runner.temp }}/zeus-dist
        run: zeus/scripts/package.sh
      - name: Verify bundle structure and signature
        run: |
          app="${RUNNER_TEMP}/zeus-dist/zeus.app"
          plutil -lint "${app}/Contents/Info.plist"
          test -x "${app}/Contents/Resources/bin/zeus"
          test -x "${app}/Contents/Resources/bin/zeus-mcp"
          test -x "${app}/Contents/Resources/bin/zeusd-rs"
          test -x "${app}/Contents/Resources/bin/zeus-holder"
          test -x "${app}/Contents/Resources/bin/zeus-ssh-askpass"
          test ! -d "${app}/Contents/Resources/bin/zeus_ZeusCore.bundle"
          test -f "${app}/Contents/Resources/bin/manifests/codex.json"
          lipo "${app}/Contents/Resources/bin/zeus" -verify_arch arm64 x86_64
          lipo "${app}/Contents/Resources/bin/zeus-mcp" -verify_arch arm64 x86_64
          lipo "${app}/Contents/Resources/bin/zeusd-rs" -verify_arch arm64 x86_64
          lipo "${app}/Contents/Resources/bin/zeus-holder" -verify_arch arm64 x86_64
          lipo "${app}/Contents/Resources/bin/zeus-ssh-askpass" -verify_arch arm64 x86_64
          test -f "${app}/Contents/Resources/bin/remote-helpers/manifest.json"
          test "$(find "${app}/Contents/Resources/bin/remote-helpers/artifacts" -name zeus-remote -type f | wc -l | tr -d ' ')" = 3
          codesign --verify --deep --strict "${app}"

  browser-sidecar:
    name: Browser sidecar integration
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
      - name: Install sidecar and browser engines
        working-directory: sidecar
        run: |
          npm ci
          npx playwright install chromium webkit firefox
      - name: Run browser unit tests
        working-directory: zeus
        run: cargo test -p zeus-engine browser -- --nocapture
