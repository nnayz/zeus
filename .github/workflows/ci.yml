name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  companion-web:
    name: Companion web contract tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Run dependency-free client and fixture conformance tests
        working-directory: prototypes/companion-web
        run: npm test

  homebrew-cask:
    name: Homebrew cask
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
      - name: Verify monorepo tap layout
        run: |
          test -d Casks
          test ! -L Casks
          test -f Casks/taskmaster.rb
      - name: Check cask syntax and style
        run: |
          ruby -c Casks/taskmaster.rb
          brew style Casks/taskmaster.rb
      - name: Validate cask metadata
        run: |
          casks="$(find Casks -maxdepth 1 -type f -name '*.rb' | sort)"
          test "${casks}" = "Casks/taskmaster.rb"
          grep -q 'github.com/nnayz/taskmaster/releases' Casks/taskmaster.rb
          grep -q 'app "taskmaster.app"' Casks/taskmaster.rb

  engine:
    name: Repo guards
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
      - name: Validate shell scripts
        run: bash -n scripts/*.sh ios/scripts/*.sh taskmaster/scripts/*.sh
      - name: Verify reviewed regressions stay fixed
        run: taskmaster/scripts/verify-remote-refactor.sh
      - name: Test release publishing guards
        run: |
          bash taskmaster/scripts/test-publish-github-release.sh
          bash taskmaster/scripts/test-publish-homebrew-cask.sh
      - name: Test optional power helper package guard
        run: bash taskmaster/scripts/check-power-helper-package.sh --self-test
      - name: Install and audit browser sidecar
        working-directory: sidecar
        run: |
          npm ci
          npm audit --omit=dev

  closed-lid-safety:
    name: Closed-lid mock safety
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: taskmaster
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
      - name: Cache focused Rust dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            taskmaster/target
          key: ${{ runner.os }}-closed-lid-${{ hashFiles('taskmaster/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-closed-lid-
      - name: Enforce mock-only source boundary and test power policy
        run: cargo test --locked -p taskmaster-power
      - name: Test exact Holder execution identity on Linux
        run: |
          cargo test --locked -p taskmaster-engine holder::protocol::tests --lib
          cargo test --locked -p taskmaster-engine holder::process_tree::tests --lib
          cargo test --locked -p taskmaster-engine --test holder --test holder_session --test deferred --test session
      - name: Test fail-closed optional package validation
        run: bash scripts/check-power-helper-package.sh --self-test

  app:
    name: Rust app (taskmaster)
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: taskmaster
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
      # rust-toolchain.toml pins 1.95.0 with clippy + rustfmt.
      - name: Cache cargo registry and target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            taskmaster/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('taskmaster/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Remote Holder acceptance and latency gates
        run: scripts/remote-acceptance.sh
      - name: Release build
        run: cargo build --workspace --release

  remote-helper-native:
    name: Remote Helper (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - runner: macos-15
            target: aarch64-apple-darwin
    defaults:
      run:
        working-directory: taskmaster
    steps:
      - uses: actions/checkout@v7
      - name: Install target
        run: rustup target add "${{ matrix.target }}"
      - name: Install native musl linker
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - name: Build exact release Helper
        env:
          TASKMASTER_REMOTE_BUILD_ID: ci-${{ matrix.target }}
        run: cargo build --locked --release --package taskmaster-remote --target "${{ matrix.target }}"
      - name: Execute native probe and verify identity
        env:
          EXPECTED_TARGET: ${{ matrix.target }}
          EXPECTED_BUILD: ci-${{ matrix.target }}
        run: |
          helper="target/${EXPECTED_TARGET}/release/taskmaster-remote"
          test -x "${helper}"
          probe="$("${helper}" probe --format=json)"
          jq -e \
            --arg target "${EXPECTED_TARGET}" \
            --arg build "${EXPECTED_BUILD}" \
            '.target == $target and .buildId == $build and .protocol.major == 1 and .supported and .holderAvailable' \
            <<<"${probe}"

  remote-ssh-soak:
    name: Remote OpenSSH detach/reconnect
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: taskmaster
    steps:
      - uses: actions/checkout@v7
      - name: Start disposable ordinary-user SSH endpoint
        run: |
          sudo apt-get update
          sudo apt-get install --yes openssh-server
          # sshd refuses to start without its privilege separation directory,
          # which the package does not create on a fresh runner image.
          sudo mkdir -p /run/sshd
          # The runner account ships with no password, which leaves it locked
          # ("!" in shadow) and makes sshd reject it before it ever considers
          # the key. Unlock it without setting one; password and
          # keyboard-interactive auth stay disabled below, so keys remain the
          # only way in on this throwaway host.
          sudo usermod -p '*' "${USER}"
          mkdir -p "${HOME}/.ssh" "${RUNNER_TEMP}/sshd"
          chmod 700 "${HOME}/.ssh"
          ssh-keygen -q -t ed25519 -N '' -f "${RUNNER_TEMP}/taskmaster_$!1i_key"
          cat "${RUNNER_TEMP}/taskmaster_$!1i_key.pub" >> "${HOME}/.ssh/authorized_keys"
          chmod 600 "${HOME}/.ssh/authorized_keys"
          printf '%s\n' \
            'Host taskmaster-ci-soak' \
            '  HostName 127.0.0.1' \
            '  Port 2222' \
            "  User ${USER}" \
            "  IdentityFile ${RUNNER_TEMP}/taskmaster_$!1i_key" \
            '  IdentitiesOnly yes' \
            '  StrictHostKeyChecking accept-new' \
            "  UserKnownHostsFile ${RUNNER_TEMP}/known_hosts" \
            > "${HOME}/.ssh/config"
          chmod 600 "${HOME}/.ssh/config"
          sudo /usr/sbin/sshd -D -e -p 2222 \
            -o PasswordAuthentication=no \
            -o KbdInteractiveAuthentication=no \
            -o UsePAM=no \
            -o AllowUsers="${USER}" \
            -o PidFile="${RUNNER_TEMP}/sshd/sshd.pid" \
            >"${RUNNER_TEMP}/sshd.log" 2>&1 &
          for attempt in $(seq 1 50); do
            if ssh -o BatchMode=yes taskmaster-ci-soak true; then
              exit 0
            fi
            sleep 0.1
          done
          cat "${RUNNER_TEMP}/sshd.log"
          exit 1
      - name: Run real SSH persistence soak
        env:
          TASKMASTER_REMOTE_SSH_TARGET: taskmaster-ci-soak
          TASKMASTER_REMOTE_SOAK_SECONDS: "5"
        run: scripts/remote-ssh-soak.sh

  bundle:
    name: Package taskmaster.app (unsigned)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
      - name: Cache cargo registry and target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            taskmaster/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('taskmaster/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      # package.sh lipos two slices into a universal binary, so both targets
      # have to be installed — and installed for the toolchain taskmaster/ pins in
      # rust-toolchain.toml, not the runner default. Adding them from the repo
      # root silently equips the wrong toolchain and the x86_64 pass then fails
      # with "can't find crate for std".
      - name: Install universal targets
        working-directory: taskmaster
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin aarch64-unknown-linux-musl x86_64-unknown-linux-musl
      - name: Install Rust packaging tools
        run: |
          brew install zig
          cargo install cargo-packager --locked
          cargo install cargo-zigbuild --locked
      - name: Package
        env:
          TASKMASTER_DIST_DIR: ${{ runner.temp }}/taskmaster-dist
        run: taskmaster/scripts/package.sh
      - name: Verify inert power helper scaffold remains unavailable
        run: |
          app="${RUNNER_TEMP}/taskmaster-dist/taskmaster.app"
          helper="${app}/Contents/Library/HelperTools/com.taskmaster.taskmaster.power-helper"
          test -f "${helper}"
          test ! -L "${helper}"
          test -x "${helper}"
          lipo "${helper}" -verify_arch arm64
          lipo "${helper}" -verify_arch x86_64

          set +e
          helper_output="$("${helper}" 2>&1)"
          helper_status=$?
          set -e
          printf '%s\n' "${helper_output}"
          test "${helper_status}" -eq 78
          grep -Fq 'power_helper_unavailable' <<<"${helper_output}"

          # The unsigned package job uses an ad-hoc signature. It must package
          # the exact inert scaffold, but the signed release checker must still
          # reject it rather than treating an ad-hoc bundle as production-valid.
          set +e
          checker_output="$(taskmaster/scripts/check-power-helper-package.sh "${app}" 2>&1)"
          checker_status=$?
          set -e
          printf '%s\n' "${checker_output}"
          test "${checker_status}" -ne 0
      - name: Verify bundle structure and signature
        run: |
          app="${RUNNER_TEMP}/taskmaster-dist/taskmaster.app"
          plutil -lint "${app}/Contents/Info.plist"
          test -s "${app}/Contents/Resources/Assets.car"
          test "$(plutil -extract CFBundleIconName raw "${app}/Contents/Info.plist")" = TaskmasterIcon
          test "$(plutil -extract CFBundleIconFile raw "${app}/Contents/Info.plist")" = icon.icns
          test -x "${app}/Contents/Resources/bin/taskmaster"
          test -x "${app}/Contents/Resources/bin/taskmaster-mcp"
          test -x "${app}/Contents/Resources/bin/taskmasterd-rs"
          test -x "${app}/Contents/Resources/bin/taskmaster-holder"
          test -x "${app}/Contents/Resources/bin/taskmaster-ssh-askpass"
          test ! -d "${app}/Contents/Resources/bin/taskmaster_TaskmasterCore.bundle"
          test -f "${app}/Contents/Resources/bin/manifests/codex.json"
          lipo "${app}/Contents/Resources/bin/taskmaster" -verify_arch arm64 x86_64
          lipo "${app}/Contents/Resources/bin/taskmaster-mcp" -verify_arch arm64 x86_64
          lipo "${app}/Contents/Resources/bin/taskmasterd-rs" -verify_arch arm64 x86_64
          lipo "${app}/Contents/Resources/bin/taskmaster-holder" -verify_arch arm64 x86_64
          lipo "${app}/Contents/Resources/bin/taskmaster-ssh-askpass" -verify_arch arm64 x86_64
          test -f "${app}/Contents/Resources/bin/remote-helpers/manifest.json"
          test "$(find "${app}/Contents/Resources/bin/remote-helpers/artifacts" -name taskmaster-remote -type f | wc -l | tr -d ' ')" = 3
          codesign --verify --deep --strict "${app}"

  browser-sidecar:
    name: Browser sidecar integration
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
      - name: Install sidecar and browser engines
        working-directory: sidecar
        run: |
          npm ci
          npx playwright install chromium webkit firefox
      - name: Run browser unit tests
        working-directory: taskmaster
        run: cargo test -p taskmaster-engine browser -- --nocapture

  docs:
    name: Website, user guide, and playbooks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Test and build the website
        working-directory: website
        run: npm test && npm run build
