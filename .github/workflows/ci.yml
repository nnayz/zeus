name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  engine:
    name: Swift engine (daemon + CLI)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - name: Validate shell scripts
        run: bash -n scripts/*.sh zeus/scripts/*.sh
      - name: Test release publishing guards
        run: |
          bash zeus/scripts/test-publish-github-release.sh
          bash zeus/scripts/test-publish-homebrew-cask.sh
      - name: Install and audit browser sidecar
        working-directory: sidecar
        run: |
          npm ci
          npm audit --omit=dev
      # --no-parallel is load-bearing on CI. Run in parallel, every test starts
      # at once, and the suite then stalls indefinitely on a 3-core runner: the
      # PTY and holder tests block inside async contexts, and with that few
      # cores the cooperative pool has no thread left to make progress on.
      # A developer Mac has enough cores to hide it. Serial costs ~30s.
      #
      # SwiftPM also block-buffers when stdout is a pipe, so a test process that
      # dies takes most of its console output with it — hence the xunit file.
      # `script` gives the run a pty, which makes SwiftPM line-buffer. Piped, it
      # block-buffers, and a test process that dies takes the tail of its output
      # with it — so the log's last line is wherever the buffer happened to
      # flush, not where the run actually stopped. That cost real debugging
      # time. The xunit file is no help either: it is only written at the end.
      - name: Test
        env:
          # Runner spawns and socket binds are far slower than on a dev Mac; the
          # 5s liveness waits time out there. See waitUntil in the test helpers.
          ZEUS_TEST_TIMEOUT_SCALE: "6"
        run: |
          set -o pipefail
          script -q /dev/null swift test --no-parallel | tee "${RUNNER_TEMP}/test.log"
          grep -q "Test run with .* passed" "${RUNNER_TEMP}/test.log"
      - name: Where it stopped
        if: failure()
        run: tail -40 "${RUNNER_TEMP}/test.log" || true
      - name: Release build
        run: swift build -c release

  app:
    name: Rust app (zeus)
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: zeus
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      # rust-toolchain.toml pins 1.95.0 with clippy + rustfmt.
      - name: Cache cargo registry and target
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            zeus/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('zeus/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Check dependency license policy
        run: python3 ../scripts/check-licenses.py
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Release build
        run: cargo build --workspace --release

  bundle:
    name: Package zeus.app (unsigned)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - name: Cache cargo registry and target
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            zeus/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('zeus/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      # package.sh lipos two slices into a universal binary, so both targets
      # have to be installed — and installed for the toolchain zeus/ pins in
      # rust-toolchain.toml, not the runner default. Adding them from the repo
      # root silently equips the wrong toolchain and the x86_64 pass then fails
      # with "can't find crate for std".
      - name: Install universal targets
        working-directory: zeus
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Install cargo-packager
        run: cargo install cargo-packager --locked
      - name: Package
        env:
          ZEUS_DIST_DIR: ${{ runner.temp }}/zeus-dist
        run: zeus/scripts/package.sh
      - name: Verify bundle structure and signature
        run: |
          app="${RUNNER_TEMP}/zeus-dist/zeus.app"
          plutil -lint "${app}/Contents/Info.plist"
          test -x "${app}/Contents/Resources/bin/zeusd"
          test -x "${app}/Contents/Resources/bin/zeusd-holder"
          test -x "${app}/Contents/Resources/bin/zeus"
          codesign --verify --deep --strict "${app}"

  browser-sidecar:
    name: Browser sidecar integration
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - name: Install sidecar and browser engines
        working-directory: sidecar
        run: |
          npm ci
          npx playwright install chromium webkit firefox
      - name: Run browser integration tests
        env:
          ZEUS_RUN_BROWSER_TESTS: "1"
        run: swift test --filter BrowserPoolTests
