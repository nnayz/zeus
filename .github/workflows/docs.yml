name: Docs

# Hosts mdBook on Vercel (see docs/vercel.json).
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: docs-vercel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build mdBook
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install mdBook
        env:
          MDBOOK_VERSION: "0.4.52"
        run: |
          set -euo pipefail
          curl -sSL \
            "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | sudo tar -xz -C /usr/local/bin
          mdbook --version

      - name: Build book
        run: |
          set -euo pipefail
          mdbook build docs
          cp docs/vercel.json docs/book/vercel.json

      - name: Upload book artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-book
          path: docs/book
          retention-days: 7

  deploy:
    name: Deploy Vercel
    needs: build
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Download book artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docs-book
          path: book

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"

      - name: Install Vercel CLI
        run: npm install --global vercel@59.1.4

      - name: Deploy preview
        if: github.event_name == 'pull_request'
        id: preview
        working-directory: book
        run: |
          set -euo pipefail
          url="$(vercel deploy --yes --token="${VERCEL_TOKEN}")"
          echo "url=${url}" >> "${GITHUB_OUTPUT}"
          echo "Preview URL: ${url}"

      - name: Deploy production
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        id: production
        working-directory: book
        run: |
          set -euo pipefail
          url="$(vercel deploy --prod --yes --token="${VERCEL_TOKEN}")"
          echo "url=${url}" >> "${GITHUB_OUTPUT}"
          echo "Production URL: ${url}"
