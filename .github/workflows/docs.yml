name: Docs

# Hosts mdBook on Vercel (see docs/vercel.json).
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: docs-vercel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build mdBook
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0

      - name: Install mdBook
        env:
          MDBOOK_VERSION: "0.4.52"
        run: |
          set -euo pipefail
          curl -sSL \
            "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | sudo tar -xz -C /usr/local/bin
          mdbook --version

      - name: Build book
        run: |
          set -euo pipefail
          mdbook build docs
          cp docs/vercel.json docs/book/vercel.json

      - name: Upload book artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: docs-book
          path: docs/book
          retention-days: 7

  deploy:
    name: Deploy Vercel
    needs: build
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Download book artifact
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: docs-book
          path: book

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Install Vercel CLI
        run: npm install --global vercel@47.2.2

      - name: Deploy preview
        if: github.event_name == 'pull_request'
        id: preview
        working-directory: book
        run: |
          set -euo pipefail
          url="$(vercel deploy --yes --token="${VERCEL_TOKEN}")"
          echo "url=${url}" >> "${GITHUB_OUTPUT}"
          echo "Preview URL: ${url}"

      - name: Deploy production
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        id: production
        working-directory: book
        run: |
          set -euo pipefail
          url="$(vercel deploy --prod --yes --token="${VERCEL_TOKEN}")"
          echo "url=${url}" >> "${GITHUB_OUTPUT}"
          echo "Production URL: ${url}"
