name: Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "website/**"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "docs/**"
      - "website/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build website
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Test and build website
        working-directory: website
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          SITE_ORIGIN: ${{ steps.pages.outputs.origin || 'https://nnayz.github.io' }}
        run: |
          set -euo pipefail
          npm test
          npm run build
          test -f dist/index.html
          test -f dist/docs/index.html
          test -f dist/docs/playbooks/index.html
          test -f dist/install/index.html
          test -f dist/docs/dev/index.html
          test ! -e dist/docs/dev/remote/index.html
          test ! -e dist/docs/dev/introduction/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/dist

  deploy:
    name: Deploy Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
