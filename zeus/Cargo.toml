[workspace]
members = [
    "crates/zeus-app",
    "crates/zeus-cli",
    "crates/zeus-client",
    "crates/zeus-companion-api",
    "crates/zeus-companion",
    "crates/zeus-companion-client",
    "crates/zeus-engine",
    "crates/zeus-node",
    "crates/zeus-mcp",
    "crates/zeus-proto",
    "crates/zeus-pty",
    "crates/zeus-remote",
    "crates/zeus-terminal-state",
    "crates/zeus-term",
    "crates/zeus-ui",
    "crates/zeus-usage",
    "crates/zeus-updater",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"

[workspace.dependencies]
alacritty_terminal = { version = "0.26", default-features = false }
base64 = "0.23"
zeus-client = { path = "crates/zeus-client" }
zeus-companion-api = { path = "crates/zeus-companion-api" }
zeus-engine = { path = "crates/zeus-engine" }
zeus-node = { path = "crates/zeus-node" }
zeus-proto = { path = "crates/zeus-proto" }
zeus-pty = { path = "crates/zeus-pty" }
zeus-terminal-state = { path = "crates/zeus-terminal-state" }
zeus-term = { path = "crates/zeus-term" }
zeus-ui = { path = "crates/zeus-ui" }
zeus-usage = { path = "crates/zeus-usage" }
zeus-updater = { path = "crates/zeus-updater" }
# Zeron's zui fork is API-compatible GPUI 0.2.2 plus bounded native backdrop
# blur, correct transparent-window compositing, and blur-aware scene batching.
# Keep this exact revision aligned with the material implementation Zeus ports.
gpui = { git = "https://github.com/zeronsh/zui", rev = "18a89af04cfe079d55275b111ac349d5640d9cda" }
gpui_platform = { git = "https://github.com/zeronsh/zui", rev = "18a89af04cfe079d55275b111ac349d5640d9cda", features = ["font-kit", "runtime_shaders"] }
image = { version = "0.25.1", default-features = false }
nucleo-matcher = "0.3"
notify = "8.2"
plist = "1"
smallvec = { version = "1.6", features = ["union", "const_new"] }
futures-core = "0.3"
futures = "0.3"
getrandom = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
rusqlite = { version = "0.40.1", features = ["bundled"] }
sha2 = "0.11"
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
unicode-segmentation = "1"
url = "2"
zeroize = { version = "1", features = ["derive"] }

# No [profile.release] overrides, deliberately: both `lto = "thin"` and
# `codegen-units = 1` make the linker reject gpui_macos's Objective-C statics
# ("ld: pointer not aligned in 'ltmp1'") — nondeterministically, depending on
# codegen partitioning, which is worse than a hard failure in a release
# pipeline. Revisit if the zui renderer or rustc changes.
