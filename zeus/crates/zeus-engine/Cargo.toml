[package]
name = "zeus-engine"
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
alacritty_terminal.workspace = true
base64.workspace = true
image = { workspace = true, features = ["jpeg"] }
zeus-proto.workspace = true
zeus-pty.workspace = true
zeus-terminal-state.workspace = true
getrandom.workspace = true
plist.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
# scap's native stack buys an in-process ScreenCaptureKit path with no
# Playwright, Node, or shell screenshot helper. Keep it out of every remote
# and terminal crate: local Engine capture is its only purpose.
scap = "=0.1.0-beta.1"
cidre = { version = "=0.22.1", default-features = false, features = [
    "async",
    "macos_13_1",
    "sc",
] }
futures.workspace = true
objc2 = "=0.6.4"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = [
    "NSAlert",
    "NSApplication",
    "NSButton",
    "NSCell",
    "NSControl",
    "NSResponder",
    "NSRunningApplication",
    "NSSecureTextField",
    "NSTextField",
    "NSView",
] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = [
    "NSGeometry",
    "NSObject",
    "NSString",
] }

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"
